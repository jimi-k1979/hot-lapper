name: Check

on:
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: make check
